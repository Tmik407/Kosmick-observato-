name: X-5 Global Space Data Archive

on:
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/global-timeseries-storage
    paths:
      - ".github/workflows/global-space-data-archive.yml"
      - "scripts/collect_global_space_archive.py"

permissions:
  contents: write

concurrency:
  group: x5-global-space-archive
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Sběr a validace veřejných datových endpointů
        run: python scripts/collect_global_space_archive.py

      - name: Ověřit výstup archivu
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          status = json.loads(Path("data/global-archive/latest-status.json").read_text(encoding="utf-8"))
          history = json.loads(Path("data/global-archive/history.json").read_text(encoding="utf-8"))
          assert len(status.get("sources", [])) == 9, "Expected nine source checks"
          assert history.get("runs"), "History must contain at least one run"
          assert history["runs"][-1]["checked_at_utc"] == status["checked_at_utc"]
          assert status.get("summary", {}).get("total") == 9
          assert status.get("schema_version") == "1.3"
          assert all("completeness" in row and "quality_score" in row for row in status["sources"])
          assert all(row.get("freshness_state") for row in status["sources"])
          assert status.get("timeseries_archive", {}).get("format") == "UTC daily JSON"
          Path("data/global-archive/timeseries").mkdir(parents=True, exist_ok=True)
          index_path = Path("data/global-archive/timeseries/index.json")
          if index_path.exists():
            index = json.loads(index_path.read_text(encoding="utf-8"))
            assert index.get("schema_version") == "1.0"
            assert isinstance(index.get("days"), list)
          print("Timeseries browser index validation OK")
          print("Archive OK:", len(status["sources"]), "sources;", len(history["runs"]), "runs")
          PY

      - name: Uložit historii do stejné větve
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/global-archive/latest-status.json data/global-archive/history.json data/global-archive/timeseries/
          if git diff --cached --quiet; then
            echo "Historie beze změny"
            exit 0
          fi
          git commit -m "Aktualizace historie globálního archivu X-5"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          echo "Nepodařilo se uložit historii po třech pokusech."
          exit 1
