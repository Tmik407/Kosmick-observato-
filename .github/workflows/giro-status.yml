name: GIRO provider and station archive
on:
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_giro_status.py"
      - ".github/workflows/giro-status.yml"
permissions:
  contents: write
concurrency:
  group: giro-status-writes
  cancel-in-progress: false
jobs:
  update-giro-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch GIRO stations and provider status
        run: python scripts/update_giro_status.py
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add giro-status.json
          if git diff --cached --quiet; then
            echo "No GIRO snapshot changes"
          else
            git commit -m "Update GIRO provider and station snapshot"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              echo "Push kolidoval, synchronizuji znovu (pokus $attempt)"
            done
            echo "Nepodařilo se bezpečně uložit GIRO snapshot po třech pokusech."
            exit 1
          fi
