name: GIRO provider and station archive
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_giro_status.py"
      - ".github/workflows/giro-status.yml"
permissions:
  contents: write
concurrency:
  group: giro-status-archive
  cancel-in-progress: false
jobs:
  update-giro-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch GIRO stations and provider status
        run: python scripts/update_giro_status.py
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add giro-status.json
          if git diff --cached --quiet; then
            echo "No GIRO snapshot changes"
          else
            git commit -m "Update GIRO provider and station snapshot"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
