name: CHMI live meteorological stations
on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"
  push:
    branches: [main]
    paths:
      - '.github/workflows/chmi-stations.yml'
      - 'scripts/update_chmi_stations.py'
permissions:
  contents: write
concurrency:
  group: chmi-stations
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Download and process CHMI observations
        run: python -m pip install --upgrade requests && python -m py_compile scripts/update_chmi_stations.py && python scripts/update_chmi_stations.py
      - name: Validate station data and report freshness
        run: |
          python - <<'PY'
          import datetime as dt, json, os
          from pathlib import Path
          doc = json.loads(Path("data/chmi-stations-latest.json").read_text(encoding="utf-8"))
          stations = doc.get("stations", [])
          station_count = int(doc.get("station_count", 0))
          fresh = int(doc.get("fresh_observation_station_count", 0))
          delayed = int(doc.get("delayed_observation_station_count", 0))
          stale = int(doc.get("stale_observation_station_count", 0))
          unknown = int(doc.get("unknown_observation_station_count", 0))
          if station_count != len(stations):
              raise SystemExit(f"CHYBA DAT: station_count={station_count}, ale seznam obsahuje {len(stations)} stanic.")
          if fresh + delayed + stale + unknown != station_count:
              raise SystemExit(
                  f"CHYBA DAT: součet kategorií {fresh + delayed + stale + unknown} "
                  f"neodpovídá počtu stanic {station_count}."
              )
          newest = doc.get("latest_observation_utc")
          age = None
          if newest:
              stamp = dt.datetime.fromisoformat(newest.replace("Z", "+00:00"))
              age = max(0, int((dt.datetime.now(dt.timezone.utc) - stamp).total_seconds() // 60))
          if age is None or age > 90:
              health = "KRITICKÉ – nejnovější měření je starší než 90 minut nebo neznámé"
          elif fresh == 0:
              health = "VAROVÁNÍ – žádná stanice nemá měření do 30 minut"
          elif delayed + stale > station_count * 0.75:
              health = "VAROVÁNÍ – více než 75 % stanic má opožděné nebo staré měření"
          else:
              health = "OK"
          summary = (
              f"### ČHMÚ – kontrola kvality a čerstvosti měření\n"
              f"- Stav: **{health}**\n"
              f"- Stanice: {station_count} (kontrola seznamu a součtu kategorií: OK)\n"
              f"- Nejnovější měření: {newest or 'neznámé'} ({age if age is not None else 'neznámé'} min)\n"
              f"- Čerstvá ≤30 min: {fresh}; opožděná 30–90 min: {delayed}; starší >90 min: {stale}; neznámý čas: {unknown}\n"
              f"- Zdrojové soubory /now: {doc.get('fresh_now_station_count', 0)}; /recent: {doc.get('recent_fallback_station_count', 0)}\n"
          )
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(summary)
          if age is None or age > 90 or fresh == 0:
              print(f"::warning::ČHMÚ – {health}.")
          if doc.get("freshness_alert"):
              drop = doc.get("fresh_observation_drop_count", 0)
              pct = doc.get("fresh_observation_drop_percent", 0)
              previous = doc.get("previous_fresh_observation_station_count", 0)
              print(f"::warning::POKLES ČERSTVÝCH STANIC ČHMÚ: {previous} → {fresh} (pokles {drop} stanic, {pct} %).")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
                  f.write(f"\n> ⚠️ **POZOR: počet čerstvých stanic poklesl o {drop} ({pct} %), z {previous} na {fresh}.**\n")
          PY
      - name: Publish station snapshot
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/chmi-stations-latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Update live CHMI station observations"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 3))
            done
            exit 1
          fi
