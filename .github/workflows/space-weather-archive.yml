name: Archiv kosmického počasí X-5
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: space-weather-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Aktualizovat archiv NOAA
        run: python scripts/update_space_weather_archive.py
      - name: Uložit archiv
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add space-weather-history.json
          git diff --cached --quiet || (git commit -m "Aktualizace archivu kosmického počasí" && git push)
