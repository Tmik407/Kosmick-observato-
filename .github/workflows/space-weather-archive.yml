name: Archiv kosmického počasí X-5
on:
  push:
    branches: [main]
    paths:
      - "scripts/update_space_weather_archive.py"
      - ".github/workflows/space-weather-archive.yml"
  schedule:
    - cron: "2-57/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: noaa-space-weather-archive-writes
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aktualizovat archiv NOAA
        run: python scripts/update_space_weather_archive.py
      - name: Ověřit integritu archivu NOAA
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("space-weather-history.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          rows=d.get("rows")
          assert isinstance(rows,list) and len(rows)>=9000, f"Archive unexpectedly short: {len(rows) if isinstance(rows,list) else 'invalid'}"
          assert d.get("source_status") and all(k in d["source_status"] for k in ("wind","mag","kp"))
          assert all(isinstance(r,dict) and r.get("t") for r in rows)
          status=json.loads(Path("space-weather-status.json").read_text(encoding="utf-8"))
          assert status.get("source_status") and all(k in status["source_status"] for k in ("wind","mag","kp"))
          assert status.get("archive_records")==len(rows)
          print(f"NOAA archive integrity OK: {len(rows)} records; {p.stat().st_size} bytes; status sidecar valid")
          PY
      - name: Uložit archiv bezpečně proti souběžným změnám
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp space-weather-history.json /tmp/space-weather-history.json
          cp space-weather-status.json /tmp/space-weather-status.json
          # Keep generated outputs outside the worktree while rebasing; stash any other
          # generated/untracked files so git pull --rebase always starts clean.
          git stash push --include-untracked -m "x5-noaa-generated-output"
          git pull --rebase origin main
          cp /tmp/space-weather-history.json space-weather-history.json
          cp /tmp/space-weather-status.json space-weather-status.json
          git stash drop 2>/dev/null || true
          git add space-weather-history.json space-weather-status.json
          if git diff --cached --quiet; then
            echo "Archiv beze změny"
          else
            git commit -m "Aktualizace archivu kosmického počasí"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then exit 0; fi
              echo "Push kolidoval, synchronizuji znovu (pokus $attempt)"
              git pull --rebase origin main
            done
            echo "Nepodařilo se bezpečně uložit archiv po třech pokusech."
            exit 1
          fi