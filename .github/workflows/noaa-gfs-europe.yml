name: NOAA GFS European maps archive
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/noaa-gfs-europe.yml'
      - 'scripts/noaa_gfs_europe.py'
  workflow_dispatch:
  schedule:
    - cron: "20 2,8,14,20 * * *"
permissions:
  contents: write
concurrency:
  group: noaa-gfs-europe-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GRIB decoder
        run: python -m pip install --upgrade pip requests numpy eccodes
      - name: Download NOAA GFS European grid
        run: python scripts/noaa_gfs_europe.py
      - name: Publish archive
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/europe-gfs/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Update NOAA GFS European 500 and 850 hPa archive"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 3))
            done
            exit 1
          fi
