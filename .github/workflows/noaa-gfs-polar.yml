name: NOAA GFS polar vortex backup

on:
  push:
    paths:
      - '.github/workflows/noaa-gfs-polar.yml'
      - 'scripts/noaa_gfs_polar_backup.py'
  workflow_dispatch:
  schedule:
    - cron: "23 1,7,13,19 * * *"

permissions:
  contents: write

concurrency:
  group: noaa-gfs-polar-backup
  cancel-in-progress: false

jobs:
  build-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GRIB decoder
        run: python -m pip install --upgrade pip requests numpy eccodes
      - name: Download and decode NOAA GFS
        run: python scripts/noaa_gfs_polar_backup.py
      - name: Publish backup data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/polar-vortex/latest.json
          if git diff --cached --quiet; then
            echo "NOAA backup unchanged; no commit needed."
          else
            git commit -m "Update NOAA GFS polar vortex backup data"
            # Other archive workflows may update main at the same time.
            # Rebase onto the latest branch and retry a non-fast-forward push.
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "NOAA backup published successfully."
                exit 0
              fi
              echo "Push race detected (attempt $attempt); retrying."
              sleep $((attempt * 2))
            done
            echo "Could not publish NOAA backup after 5 attempts."
            exit 1
          fi
