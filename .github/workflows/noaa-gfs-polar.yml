name: NOAA GFS polar vortex backup

on:
  workflow_dispatch:
  schedule:
    - cron: "23 1,7,13,19 * * *"

permissions:
  contents: write

concurrency:
  group: noaa-gfs-polar-backup
  cancel-in-progress: false

jobs:
  build-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GRIB decoder
        run: python -m pip install --upgrade pip requests numpy eccodes
      - name: Download and decode NOAA GFS
        run: python scripts/noaa_gfs_polar_backup.py
      - name: Publish backup data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/polar-vortex/latest.json
          if git diff --cached --quiet; then
            echo "NOAA backup unchanged; no commit needed."
          else
            git commit -m "Update NOAA GFS polar vortex backup data"
            git push
          fi
