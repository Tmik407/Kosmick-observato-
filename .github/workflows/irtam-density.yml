name: IRTAM electron density archive
on:
  push:
    paths:
      - "scripts/update_irtam_density.py"
      - ".github/workflows/irtam-density.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-irtam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install scientific model
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyIRTAM
      - name: Calculate global electron density (48-hour delayed)
        run: python scripts/update_irtam_density.py
      - name: Commit model grid
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add irtam-density.json
          if git diff --cached --quiet; then
            echo "No IRTAM changes"
          else
            git commit -m "Update delayed IRTAM global electron density"
            # Other scheduled archive jobs may update main while this model runs.
            # Rebase our generated grid on the latest main before pushing.
            git pull --rebase origin main
            git push origin HEAD:main
          fi
