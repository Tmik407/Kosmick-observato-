name: IRTAM electron density archive
on:
  push:
    paths:
      - "scripts/update_irtam_density.py"
      - ".github/workflows/irtam-density.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: irtam-density
  cancel-in-progress: false
jobs:
  build-irtam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install scientific model
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyIRTAM
      - name: Calculate global electron density (48-hour delayed)
        run: python scripts/update_irtam_density.py
      - name: Commit model grid and run status
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Preserve this run's generated files outside the worktree first.
          # Another IRTAM run may have created/updated irtam-status.json while
          # this calculation was running; rebase before restoring our outputs.
          mkdir -p /tmp/x5-irtam-output
          if [ -f irtam-density.json ]; then cp irtam-density.json /tmp/x5-irtam-output/irtam-density.json; fi
          if [ -f irtam-status.json ]; then cp irtam-status.json /tmp/x5-irtam-output/irtam-status.json; fi
          # Stash every worktree change (including untracked files) before
          # synchronizing; the model output is safely copied to /tmp above.
          git stash push --include-untracked -m "x5-irtam-generated-output"
          git pull --rebase origin main
          if [ -f /tmp/x5-irtam-output/irtam-density.json ]; then cp /tmp/x5-irtam-output/irtam-density.json irtam-density.json; fi
          if [ -f /tmp/x5-irtam-output/irtam-status.json ]; then cp /tmp/x5-irtam-output/irtam-status.json irtam-status.json; fi
          git stash drop 2>/dev/null || true
          git add irtam-density.json irtam-status.json
          if git diff --cached --quiet; then
            echo "No IRTAM changes"
          else
            git commit -m "Update delayed IRTAM global electron density"
            git push origin HEAD:main
          fi
