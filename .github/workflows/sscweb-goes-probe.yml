name: NASA SSCWeb GOES geomagnetic coordinate probe
on:
  push:
    paths:
      - 'scripts/test_sscweb_goes.py'
      - '.github/workflows/sscweb-goes-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Query NASA SSCWeb catalog and GM coordinates
        run: python scripts/test_sscweb_goes.py
