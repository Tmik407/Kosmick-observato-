name: X-5 Guardian · public read-only data

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: write

concurrency:
  group: x5-guardian-public-data
  cancel-in-progress: true

jobs:
  diagnose-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Guardian diagnostic tools
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: x5-ai-guardian-phase2-main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Restore bounded history
        uses: actions/cache/restore@v4
        with:
          path: guardian-history/history.json
          key: x5-guardian-public-history-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            x5-guardian-public-history-
      - name: Run live diagnostics
        run: python3 scripts/x5_guardian.py
      - name: Update history
        if: always() && hashFiles('x5-guardian-diagnostics.json') != ''
        run: python3 scripts/x5_history.py x5-guardian-diagnostics.json guardian-history/history.json
      - name: Analyze findings and recurring issues
        if: always() && hashFiles('x5-guardian-diagnostics.json') != ''
        run: python3 scripts/x5_guardian_analysis.py x5-guardian-diagnostics.json guardian-history/history.json
      - name: Save bounded history
        if: always() && hashFiles('guardian-history/history.json') != ''
        uses: actions/cache/save@v4
        with:
          path: guardian-history/history.json
          key: x5-guardian-public-history-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish public JSON to isolated data branch
        if: always() && hashFiles('x5-guardian-diagnostics.json') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const files = [
              ['latest/diagnostics.json', 'x5-guardian-diagnostics.json'],
              ['latest/history.json', 'guardian-history/history.json']
            ];
            for (const [path, localPath] of files) {
              if (!fs.existsSync(localPath)) continue;
              const content = fs.readFileSync(localPath, 'utf8');
              let sha;
              try {
                const current = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path,
                  ref: 'x5-guardian-data'
                });
                if (!Array.isArray(current.data)) sha = current.data.sha;
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              await github.rest.repos.createOrUpdateFileContents({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                branch: 'x5-guardian-data',
                message: 'Update public X-5 Guardian data',
                content: Buffer.from(content, 'utf8').toString('base64'),
                ...(sha ? { sha } : {})
              });
              core.info('Published ' + path);
            }
