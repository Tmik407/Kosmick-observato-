name: Nasadit Kosmickou observatoř X-5

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Načíst repozitář
        uses: actions/checkout@v4
      - name: Nastavit GitHub Pages
        uses: actions/configure-pages@v5
      - name: Připravit web
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publikovat web
        id: deployment
        uses: actions/deploy-pages@v4
