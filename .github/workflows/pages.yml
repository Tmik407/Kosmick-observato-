name: Nasadit Kosmickou observatoř X-5

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: x5-pages-publish
  cancel-in-progress: false

jobs:
  build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Načíst repozitář
        uses: actions/checkout@v4
      - name: Nastavit GitHub Pages
        uses: actions/configure-pages@v5
      - name: Připravit web
        run: |
          mkdir -p _site
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='_site/' ./ _site/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/polarni-vir.html
          test -s _site/polar-vortex-3d.html
          test -s _site/data/polar-vortex-10hpa-timeline.json
          test -s _site/data/u60_daily.csv
          python - <<'PY'
          import re
          from pathlib import Path
          files = [Path("_site/index.html"), Path("_site/polarni-vir.html"), Path("_site/polar-vortex-3d.html"), Path("_site/mapa-cr-3d.html"), Path("_site/mapa-cr-3d-nova.html")]
          count = 0
          for page in files:
              source = page.read_text(encoding="utf-8")
              for i, match in enumerate(re.finditer(r"""<script\b([^>]*)>(.*?)</script>""", source, re.I|re.S), 1):
                  attrs, body = match.groups()
                  if re.search(r"""type=["']text/plain["']""", attrs, re.I) or not body.strip():
                      continue
                  Path(f"/tmp/x5-{page.stem}-inline-{i}.js").write_text(body, encoding="utf-8")
                  count += 1
              if page.name == "polarni-vir.html":
                  for src in re.findall(r"""<script\b[^>]*\bsrc=["']([^"']+)""", source, re.I):
                      if src.startswith(("http://", "https://", "//")):
                          continue
                      clean = src.split("?", 1)[0]
                      if clean.startswith("/Kosmick-observato-/"):
                          local = Path("_site") / clean.split("/Kosmick-observato-/", 1)[1]
                      else:
                          local = Path("_site") / clean.lstrip("/")
                      if not local.is_file():
                          raise SystemExit(f"Missing local script: {src}")
                      if local.suffix == ".js":
                          Path(f"/tmp/x5-external-{count}.js").write_text(local.read_text(encoding="utf-8"), encoding="utf-8")
                          count += 1
          print(f"Extracted {count} active inline and local JavaScript files for syntax validation.")
          PY
          for file in /tmp/x5-*.js; do node --check "$file"; done
          grep -q 'color-scheme:dark' _site/polarni-vir.html
          ! grep -q 'X-5 LIGHT SCIENTIFIC THEME' _site/polarni-vir.html
          grep -q 'id="p3dCanvas"' _site/polarni-vir.html
          grep -q 'gfs-polarni-3d.js' _site/polarni-vir.html
          echo "Polární vír: tmavý motiv, 3D plátno a JavaScriptové závislosti ověřeny."
      - name: Nahrát kompletní web
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site
      - name: Počkat na dostupnost balíčku GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          api_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100"
          for attempt in $(seq 1 18); do
            response=$(curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${api_url}")
            if printf '%s' "$response" | ARTIFACT_NAME="$ARTIFACT_NAME" python -c 'import json,os,sys; d=json.load(sys.stdin); sys.exit(0 if any(a.get("name")==os.environ["ARTIFACT_NAME"] and not a.get("expired",False) for a in d.get("artifacts",[])) else 1)'; then
              echo "Balíček ${ARTIFACT_NAME} je dostupný přes GitHub API."
              exit 0
            fi
            echo "Balíček zatím není dostupný (pokus ${attempt}/18); čekám 5 sekund."
            sleep 5
          done
          echo "Balíček ${ARTIFACT_NAME} nebyl po 90 sekundách dostupný."
          exit 1
      - name: Publikovat web
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Ověřit nasazený web a datové panely
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$SITE_URL"
          for path in index.html polarni-vir.html polar-vortex-3d.html mapa-cr-3d.html data/chmi-stations-latest.json mapa-cr-3d-nova.html data/polar-vortex-10hpa-timeline.json gfs-polarni-3d.js ch1411-impact.json space-weather-history.json space-weather-status.json coronal-hole-history.json giro-status.json irtam-density.json aurora-history.json bfo-bdv-quality-2026-11-01.json manifest.webmanifest sw.js offline.html icon.svg; do
            ok=0
            for attempt in $(seq 1 12); do
              code=$(curl --silent --show-error --location --output "/tmp/x5-check" --write-out "%{http_code}" "$SITE_URL$path" || true)
              if [ "$code" = "200" ] && [ -s /tmp/x5-check ]; then
                ok=1
                break
              fi
              sleep 10
            done
            if [ "$ok" != "1" ]; then
              echo "Kontrola selhala: $path (HTTP $code)"
              exit 1
            fi
            case "$path" in
              *.json|*.webmanifest) python -c 'import json,sys; json.load(open(sys.argv[1], encoding="utf-8"))' /tmp/x5-check ;;
            esac
            echo "OK: $path"
          done
          curl --fail --silent --show-error --location "${SITE_URL}index.html" -o /tmp/x5-index.html
          grep -q 'Kosmická observatoř X-5' /tmp/x5-index.html
          grep -q 'ch1411ImpactPanel' /tmp/x5-index.html
          grep -q 'historyQualityPanel' /tmp/x5-index.html
          grep -q 'sourceFreshnessPanel' /tmp/x5-index.html
          grep -q 'Poslední pokus o načtení' /tmp/x5-index.html
          grep -q 'Skutečné stáří' /tmp/x5-index.html
          grep -q 'request_status' /tmp/x5-index.html
          grep -q 'loadHistoryQuality' /tmp/x5-index.html
          grep -q 'manifest.webmanifest' /tmp/x5-index.html
          grep -q 'serviceWorker.register' /tmp/x5-index.html
          grep -q 'beforeinstallprompt' /tmp/x5-index.html
          echo "PWA manifest, service worker, offline stránka a instalační rozhraní ověřeny."
          curl --fail --silent --show-error --location "${SITE_URL}polarni-vir.html" -o /tmp/x5-polar.html
          grep -q 'id="polar3dModel"' /tmp/x5-polar.html
          grep -q 'id="p3dCanvas"' /tmp/x5-polar.html
          grep -q 'gfs-polarni-3d.js' /tmp/x5-polar.html
          grep -q 'X-5 SVĚTLÝ VĚDECKÝ VZHLED' /tmp/x5-polar.html
          grep -q 'color-scheme:light' /tmp/x5-polar.html
          grep -q 'background:linear-gradient(180deg,#eaf2f9' /tmp/x5-polar.html
          curl --fail --silent --show-error --location "${SITE_URL}gfs-polarni-3d.js" -o /tmp/x5-gfs-3d.js
          node --check /tmp/x5-gfs-3d.js
          curl --fail --silent --show-error --location "${SITE_URL}data/polar-vortex/latest.json" -o /tmp/x5-polar-data.json
          python -c 'import json,sys; d=json.load(open(sys.argv[1],encoding="utf-8")); assert d.get("source")=="NOAA NOMADS GFS 0.25° GRIB2"; assert len(d.get("rows",[]))==len(d.get("points",[]))==40; assert len(d.get("times",[]))>=1; assert all(len(r.get("hourly",{}).get("temperature_"+str(p)+"hPa",[]))==len(d["times"]) for r in d["rows"] for p in (10,30,50)); print("NOAA GFS data OK:",len(d["rows"]),"points,",len(d["times"]),"time steps")' /tmp/x5-polar-data.json
          echo "Ověřeno: světlý vzhled, 3D plátno, skript a datová řada NOAA GFS."
          curl --fail --silent --show-error --location "${SITE_URL}polar-vortex-3d.html" -o /tmp/x5-vortex.html
          grep -q 'id="ecmwfTimeline"' /tmp/x5-vortex.html
          grep -q 'id="timelineU60"' /tmp/x5-vortex.html
          grep -q 'id="timelinePolarTemp"' /tmp/x5-vortex.html
          grep -q 'id="sswForecastSignal"' /tmp/x5-vortex.html
          grep -q 'id="ecmwfPolarMap"' /tmp/x5-vortex.html
          echo "ECMWF animace a diagnostika SSW předpovědního signálu ověřeny."
          curl --fail --silent --show-error --location "${SITE_URL}mapa-cr-3d.html" -o /tmp/x5-weather-map.html
          grep -q 'temperature-circles' /tmp/x5-weather-map.html
          grep -q 'precip-circles' /tmp/x5-weather-map.html
          grep -q 'findPrecip' /tmp/x5-weather-map.html
          grep -q 'for(let arm=0;arm<3;arm++)' /tmp/x5-weather-map.html
          curl --fail --silent --show-error --location "${SITE_URL}data/chmi-stations-latest.json" -o /tmp/x5-chmi.json
          python -c 'import json,sys; d=json.load(open(sys.argv[1],encoding="utf-8")); assert len(d.get("stations",[]))>0; print("ČHMÚ stations OK:",len(d["stations"]))' /tmp/x5-chmi.json
          echo "Mapa počasí: teplota, déšť/sníh, test srážek a archiv ČHMÚ ověřeny."
          curl --fail --silent --show-error --location "${SITE_URL}mapa-cr-3d-nova.html" -o /tmp/x5-weather-map-new.html
          grep -q 'api.open-meteo.com/v1/ecmwf' /tmp/x5-weather-map-new.html
          grep -q 'data-layer="precipitation"' /tmp/x5-weather-map-new.html
          grep -q 'chmi-stations-latest.json' /tmp/x5-weather-map-new.html
          grep -q 'id="time"' /tmp/x5-weather-map-new.html
          grep -q 'async function loadMetNoFallback' /tmp/x5-weather-map-new.html
          grep -q 'api.met.no/weatherapi/locationforecast/2.0/compact' /tmp/x5-weather-map-new.html
          echo "Nová mapa X-5: předpověď, vrstvy a stanice ČHMÚ ověřeny."
          echo "Smoke test X-5 dokončen."
