name: Nasadit Kosmickou observatoř X-5

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: x5-pages-publish
  cancel-in-progress: true

jobs:
  build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Načíst repozitář
        uses: actions/checkout@v4
      - name: Nastavit GitHub Pages
        uses: actions/configure-pages@v5
      - name: Připravit web
        run: |
          mkdir -p _site
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='_site/' ./ _site/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/polarni-vir.html
          test -s _site/data/u60_daily.csv
      - name: Nahrát kompletní web
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publikovat web
        id: deployment
        uses: actions/deploy-pages@v4
