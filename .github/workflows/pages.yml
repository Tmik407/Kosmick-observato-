name: Nasadit Kosmickou observatoř X-5

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: x5-pages-publish
  cancel-in-progress: false

jobs:
  build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Načíst repozitář
        uses: actions/checkout@v4
      - name: Nastavit GitHub Pages
        uses: actions/configure-pages@v5
      - name: Připravit web
        run: |
          mkdir -p _site
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='_site/' ./ _site/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/polarni-vir.html
          test -s _site/data/u60_daily.csv
      - name: Nahrát kompletní web
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publikovat web
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Ověřit nasazený web a datové panely
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$SITE_URL"
          for path in index.html polarni-vir.html ch1411-impact.json space-weather-history.json coronal-hole-history.json giro-status.json irtam-density.json aurora-history.json bfo-bdv-quality-2026-11-01.json; do
            ok=0
            for attempt in $(seq 1 12); do
              code=$(curl --silent --show-error --location --output "/tmp/x5-check" --write-out "%{http_code}" "$SITE_URL$path" || true)
              if [ "$code" = "200" ] && [ -s /tmp/x5-check ]; then
                ok=1
                break
              fi
              sleep 10
            done
            if [ "$ok" != "1" ]; then
              echo "Kontrola selhala: $path (HTTP $code)"
              exit 1
            fi
            case "$path" in
              *.json) python -c 'import json,sys; json.load(open(sys.argv[1], encoding="utf-8"))' /tmp/x5-check ;;
            esac
            echo "OK: $path"
          done
          curl --fail --silent --show-error --location "${SITE_URL}index.html" -o /tmp/x5-index.html
          grep -q 'Kosmická observatoř X-5' /tmp/x5-index.html
          grep -q 'ch1411ImpactPanel' /tmp/x5-index.html
          grep -q 'historyQualityPanel' /tmp/x5-index.html
          grep -q 'loadHistoryQuality' /tmp/x5-index.html
          echo "Smoke test X-5 dokončen."
