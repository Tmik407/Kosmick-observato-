name: CH1411 impact analysis
on:
  push:
    branches: [main]
    paths:
      - "scripts/build_ch1411_impact.py"
      - ".github/workflows/ch1411-impact.yml"
      - "space-weather-history.json"
      - "coronal-hole-history.json"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ch1411-impact
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Build CH1411 impact comparison
        run: python scripts/build_ch1411_impact.py
      - name: Save report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp ch1411-impact.json /tmp/ch1411-impact.json
          git restore -- ch1411-impact.json
          git pull --rebase origin main
          cp /tmp/ch1411-impact.json ch1411-impact.json
          git add ch1411-impact.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update CH1411 impact analysis"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
