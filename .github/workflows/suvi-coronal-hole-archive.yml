name: NOAA SUVI coronal-hole archive
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repository-main-writes
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install data reader
        run: python -m pip install --disable-pip-version-check numpy netCDF4
      - name: Fetch latest NOAA boundary product
        run: python scripts/update_coronal_holes.py
      - name: Commit archive when changed
        run: |
          if git ls-files --error-unmatch coronal-hole-history.json >/dev/null 2>&1 && git diff --quiet -- coronal-hole-history.json; then
            echo "NOAA product unchanged; archive not modified."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp coronal-hole-history.json /tmp/coronal-hole-history.json
          git restore -- coronal-hole-history.json
          git pull --rebase origin main
          cp /tmp/coronal-hole-history.json coronal-hole-history.json
          git add -f coronal-hole-history.json
          if git diff --cached --quiet; then
            echo "NOAA archive unchanged after synchronization."
            exit 0
          fi
          git commit -m "Update NOAA SUVI coronal-hole archive"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            echo "Push collision; rebasing and retrying ($attempt)"
            git pull --rebase origin main
          done
          echo "Could not safely publish SUVI archive after three attempts."
          exit 1
