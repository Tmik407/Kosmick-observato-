name: NOAA SUVI coronal-hole archive
on:
  push:
    paths:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: suvi-coronal-hole-archive
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install data reader
        run: python -m pip install --disable-pip-version-check numpy netCDF4
      - name: Fetch latest NOAA boundary product
        run: python scripts/update_coronal_holes.py
      - name: Commit archive when changed
        run: |
          if git diff --quiet -- coronal-hole-history.json; then
            echo "NOAA product unchanged; archive not modified."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coronal-hole-history.json
          git commit -m "Update NOAA SUVI coronal-hole archive"
          git push
