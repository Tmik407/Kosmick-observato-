name: X-5 Guardian · sandbox tests and diagnostics

on:
  push:
    branches:
      - x5-ai-guardian-phase1
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions: {}

concurrency:
  group: x5-ai-guardian-phase3
  cancel-in-progress: true

jobs:
  validate-and-diagnose:
    name: Validate advisor, then diagnose live services
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 8
    steps:
      - name: Checkout trusted branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Run repair-advisor unit tests
        working-directory: scripts
        run: python -m unittest -v test_x5_repair_advisor.py
      - name: Run live diagnostics
        run: python3 scripts/x5_guardian.py
      - name: Generate repair proposals (no changes applied)
        if: always()
        run: |
          if [ -f x5-guardian-diagnostics.json ]; then
            python3 scripts/x5_repair_advisor.py x5-guardian-diagnostics.json
          else
            echo "Diagnostika nevytvořila JSON; návrhy oprav nebyly vygenerovány." >> "$GITHUB_STEP_SUMMARY"
          fi
