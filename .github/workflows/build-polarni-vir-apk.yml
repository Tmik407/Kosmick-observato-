name: Build Polarni vir X-5 Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-polarni-vir-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create Android WebView wrapper
        shell: bash
        run: |
          mkdir polarni-vir-android
          cd polarni-vir-android
          npm init -y
          npm install @capacitor/core@7 @capacitor/android@7
          npm install --save-dev @capacitor/cli@7
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "cz.projektx5.polarni",
            "appName": "Polarni vir X-5",
            "webDir": "www",
            "server": {
              "url": "https://tmik407.github.io/Kosmick-observato-/polarni-vir.html",
              "cleartext": false
            },
            "android": {
              "allowMixedContent": false
            }
          }
          EOF
          mkdir www
          cat > www/index.html <<'EOF'
          <!doctype html>
          <html lang="cs">
          <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0;url=https://tmik407.github.io/Kosmick-observato-/polarni-vir.html"><title>Polární vír X-5</title></head>
          <body><p>Otevírám aplikaci Polární vír X-5…</p><a href="https://tmik407.github.io/Kosmick-observato-/polarni-vir.html">Pokračovat</a></body>
          </html>
          EOF
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: polarni-vir-android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: polarni-vir-x5-android-apk
          path: polarni-vir-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
