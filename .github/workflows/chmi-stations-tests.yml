name: CHMI ingestion tests

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/update_chmi_stations.py"
      - "tests/test_chmi_station_fallback.py"
      - ".github/workflows/chmi-stations-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install requests
      - name: Validate Python syntax
        run: python -m py_compile scripts/update_chmi_stations.py tests/test_chmi_station_fallback.py
      - name: Test live/archive fallback
        run: python -m unittest discover -s tests -p "test_chmi_station_fallback.py" -v
