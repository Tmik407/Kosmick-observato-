name: GOES ephemeris position context
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/goes-ephemeris.yml'
      - 'scripts/update_goes_ephemeris.py'
  schedule:
    - cron: "35 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: goes-ephemeris-archive
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install NetCDF reader
        run: python -m pip install --disable-pip-version-check numpy netCDF4
      - name: Download and extract NOAA GOES ephemeris
        run: python scripts/update_goes_ephemeris.py
      - name: Commit position context when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/space-weather/goes-ephemeris.json
          if git diff --cached --quiet; then
            echo "GOES ephemeris unchanged."
            exit 0
          fi
          git commit -m "Update NOAA GOES ephemeris position context"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            echo "Push collision; rebasing and retrying ($attempt)"
            git pull --rebase origin main
          done
          echo "Could not publish GOES ephemeris after three attempts."
          exit 1
