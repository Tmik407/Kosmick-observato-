name: Aktualizace dat a publikace modelu polárního víru X-5

on:
  push:
    branches: [main]
    paths:
      - 'polarni-vir.html'
      - '.github/workflows/polarni-vir-pages.yml'
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Sdílí zámek s hlavním pages.yml, aby se dvě nasazení nepřepisovala.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Načíst repozitář
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Stáhnout a ověřit denní archiv ERA5
        run: |
          set -euo pipefail
          mkdir -p data
          curl --fail --location --retry 3 --retry-delay 5 \
            https://www.polarvortex.earth/data/u60_daily.csv \
            -o data/u60_daily.csv
          curl --fail --location --retry 3 --retry-delay 5 \
            https://www.polarvortex.earth/data/wave_forcing_daily.csv \
            -o data/wave_forcing_daily.csv
          python - <<'PY'
          import csv, json
          from datetime import datetime, timezone
          from pathlib import Path
          specs = {
              "u60_daily.csv": {"required": {"date", "u60_10hpa_60n_ms", "capT_10hpa_n_k"}},
              "wave_forcing_daily.csv": {"required": {"date", "vt100_n_kms", "z10_wave1_60n_m", "z10_wave2_60n_m"}}
          }
          meta = {
              "retrieved_utc": datetime.now(timezone.utc).isoformat(),
              "source": "ERA5-derived daily diagnostics distributed by polarvortex.earth",
              "classification": "REANALYSIS_DERIVED",
              "attribution": "Contains modified Copernicus Climate Change Service information. ERA5: Hersbach et al. (2020).",
              "files": {}
          }
          for name, spec in specs.items():
              path = Path("data") / name
              with path.open(encoding="utf-8-sig", newline="") as f:
                  reader = csv.DictReader(f)
                  header = set(reader.fieldnames or [])
                  missing = spec["required"] - header
                  if missing:
                      raise SystemExit(f"{name}: missing required columns {sorted(missing)}; got {sorted(header)}")
                  rows = list(reader)
              if len(rows) < 1000:
                  raise SystemExit(f"{name}: too few records ({len(rows)})")
              dates = [r.get("date", "") for r in rows if r.get("date")]
              if not dates:
                  raise SystemExit(f"{name}: no valid dates")
              meta["files"][name] = {
                  "rows": len(rows),
                  "columns": list(reader.fieldnames or []),
                  "first_date": dates[0],
                  "last_date": dates[-1],
                  "bytes": path.stat().st_size
              }
          (Path("data") / "archive-meta.json").write_text(
              json.dumps(meta, ensure_ascii=False, indent=2) + "\\n",
              encoding="utf-8"
          )
          print(json.dumps(meta, ensure_ascii=False, indent=2))
          PY

      - name: Uložit archiv do historie Git
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/u60_daily.csv data/wave_forcing_daily.csv data/archive-meta.json
          if ! git diff --cached --quiet; then
            git commit -m "Update daily polar vortex ERA5 archive"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "Archiv se nezměnil; ponechávám stávající verzi."
          fi

      - name: Připravit celý web včetně oddělené stránky polárního víru
        run: |
          set -euo pipefail
          mkdir -p _site
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='_site/' ./ _site/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/polarni-vir.html
          test -s _site/data/u60_daily.csv
          test -s _site/data/wave_forcing_daily.csv

      - name: Nastavit GitHub Pages
        uses: actions/configure-pages@v5

      - name: Nahrát kompletní web
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publikovat kompletní web X-5
        id: deployment
        uses: actions/deploy-pages@v4
